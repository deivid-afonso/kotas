<!doctype html>
<html>
<head><meta charset="utf-8"><title>Assina</title>
<script>
// SPA redirect for GitHub Pages — preserves path for React Router
var seg = window.location.pathname.split('/').filter(Boolean);
var repo = seg[0] === 'kotas' ? '/kotas/' : '/';
sessionStorage.setItem('redirect', window.location.pathname + window.location.search);
window.location.replace(repo);
</script>
</head>
<body></body>
</html>
